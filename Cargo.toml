[package]
name = "plume"
version = "0.1.0"
edition = "2021"

[lib]
name = "plume"
path = "src/lib.rs"

[[bin]]
name = "plume"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
cpal = "0.15"
evdev = "0.12"
arboard = "3"
ksni = "0.2"
llama-cpp-2 = { version = "0.1" }
rusqlite = "0.31"
hound = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
notify-rust = { version = "4", default-features = false, features = ["d"] }
atspi = { version = "0.21", default-features = false, features = ["tokio"] }
futures-util = "0.3"
gtk4 = "0.9"
png = "0.17"
whisper-rs = "0.16"
opus = { version = "0.3", optional = true }
ogg = { version = "0.9", optional = true }
libc = "0.2"

[features]
cuda = ["llama-cpp-2/cuda", "whisper-rs/cuda"]
vulkan = ["llama-cpp-2/vulkan", "whisper-rs/vulkan"]
default = ["opus"]
opus = ["dep:opus", "dep:ogg"]

[dev-dependencies]
mockall = "0.13"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# whisper.cpp et llama.cpp embarquent chacun leur ggml : la copie vendorisée préfixe les symboles de celui de whisper (voir son build.rs) pour les lier dans un seul binaire.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
